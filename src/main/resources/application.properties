spring.application.name=nse-catalyst-terminal
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8085}

# Database (Embedded H2 persistent file store)
spring.datasource.url=jdbc:h2:file:./data/catalystdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# Servlet Multipart (On-Demand PDF Uploads)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Task Scheduling
spring.task.scheduling.pool.size=6

# Actuator (Locked down by default)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Logging
logging.level.root=INFO
logging.level.com.catalyst.terminal=INFO
logging.file.name=logs/catalyst-terminal.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Catalyst Terminal Configuration
catalyst.gemini.api-key=${GEMINI_API_KEY:}
catalyst.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
catalyst.gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}

catalyst.nse.feed-url=${NSE_FEED_URL:https://nsearchives.nseindia.com/content/RSS/Online_announcements.xml}
catalyst.nse.poller-enabled=${NSE_POLLER_ENABLED:true}
catalyst.nse.poll-delay-ms=${NSE_POLL_DELAY_MS:3000}
catalyst.nse.market-hours-only=${NSE_MARKET_HOURS_ONLY:false}

catalyst.pdf.max-pages=${PDF_MAX_PAGES:6}
catalyst.pdf.max-chars=${PDF_MAX_CHARS:10000}

catalyst.alerts.telegram-enabled=${TELEGRAM_ENABLED:false}
catalyst.alerts.telegram-bot-token=${TELEGRAM_BOT_TOKEN:}
catalyst.alerts.telegram-chat-id=${TELEGRAM_CHAT_ID:}
catalyst.alerts.min-score=${TELEGRAM_MIN_SCORE:70}
catalyst.alerts.watchlist-min-score=${TELEGRAM_WATCHLIST_MIN_SCORE:40}

catalyst.retention.days=${RETENTION_DAYS:365}

# DhanHQ API Configuration (v2 Live Market Feed & Data APIs)
trader.dhan.enabled=${DHAN_ENABLED:false}
trader.dhan.client-id=${DHAN_CLIENT_ID:}
trader.dhan.access-token=${DHAN_ACCESS_TOKEN:}
trader.dhan.ws-url=${DHAN_WS_URL:wss://api-feed.dhan.co}
trader.dhan.request-code=${DHAN_REQUEST_CODE:17}
trader.dhan.auth-type=${DHAN_AUTH_TYPE:2}
trader.dhan.version=${DHAN_VERSION:2}
trader.dhan.pin=${DHAN_PIN:}
trader.dhan.totp-secret=${DHAN_TOTP_SECRET:}

# 3-Stage Intraday Funnel & Guardrails
catalyst.funnel.enabled=${FUNNEL_ENABLED:true}
catalyst.funnel.rank-interval-ms=${FUNNEL_RANK_INTERVAL_MS:60000}
catalyst.funnel.min-composite-score=${FUNNEL_MIN_COMPOSITE_SCORE:75.0}
catalyst.funnel.max-ranked-setups=${FUNNEL_MAX_RANKED_SETUPS:10}
catalyst.funnel.min-turnover-cr=${FUNNEL_MIN_TURNOVER_CR:20.0}
catalyst.funnel.min-price=${FUNNEL_MIN_PRICE:50.0}
catalyst.funnel.max-atr-multiple=${FUNNEL_MAX_ATR_MULTIPLE:2.0}
catalyst.funnel.hard-exhaustion-atr-multiple=${FUNNEL_HARD_EXHAUSTION_ATR_MULTIPLE:2.5}
catalyst.funnel.min-risk-reward=${FUNNEL_MIN_RISK_REWARD:2.0}
catalyst.funnel.capital-inr=${TRADER_CAPITAL_INR:100000}
catalyst.funnel.risk-per-trade-pct=${TRADER_RISK_PCT:1.0}


